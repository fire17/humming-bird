name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install . pyinstaller==6.16.0 build
      - run: python -m unittest discover -v
      - run: humming-bird --check
      - run: python -m build --wheel
      - run: python scripts/build_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: humming-bird-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
            dist/*.whl
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "Humming Bird $GITHUB_REF_NAME" --generate-notes
